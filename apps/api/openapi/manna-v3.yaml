openapi: 3.0.3
info:
  title: Eden Manna V3 API
  version: 0.1.0
  description: v3 manna endpoints
servers:
  - url: /

paths:
  /v3/manna/vouchers/redeem:
    post:
      tags: [Manna]
      summary: Redeem manna voucher
      description:
        Redeem a manna voucher code to add manna to the authenticated user's
        account.
      operationId: manna.redeemVoucher
      x-eden:
        method: manna.redeemVoucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MannaVoucherRedeemRequest'
      responses:
        '200':
          description: Voucher redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MannaVoucherRedeemResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

components:
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    MannaVoucherRedeemRequest:
      type: object
      properties:
        code:
          type: string
      required: [code]

    MannaVoucherRedeemResponse:
      type: object
      properties:
        success:
          type: boolean
        action:
          type: string
        manna:
          type: number
        transactionId:
          type: string
