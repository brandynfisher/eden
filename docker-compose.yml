version: '3.8'

services:
  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - '27017:27017'
    volumes:
      - ./data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  minio:
    build:
      context: .
      dockerfile: ./scripts/minio.Dockerfile
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: eden12345
      MINIO_ROOT_PASSWORD: eden12345
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
