name: 'Build and Deploy - Garden'

on:
  push:
    branches: [staging]
    paths:
      - 'apps/garden/**'
      - '.github/workflows/garden.yaml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-20.04
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v2

      - id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          IMAGE="${{ secrets.REGISTRY_URL }}/abraham-ai/mars-${{ secrets.ENV_GARDEN }}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: docker context create builders

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        with:
          driver: docker

      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./apps/garden/Dockerfile
          push: true
          tags:
            ${{ steps.prep.outputs.tagged_image }},${{ steps.prep.outputs.image
            }}:latest
          build-args: |
            "NEXT_PUBLIC_HOST=${{ secrets.NEXT_PUBLIC_HOST }}"
            "NEXT_PUBLIC_ALCHEMY_API_KEY_SEPOLIA"="${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY_SEPOLIA }}"
            "NEXT_PUBLIC_PARTICLE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_PARTICLE_PROJECT_ID }}"
            "NEXT_PUBLIC_PARTICLE_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_PARTICLE_CLIENT_KEY }}"
            "NEXT_PUBLIC_PARTICLE_APP_ID=${{ secrets.NEXT_PUBLIC_PARTICLE_APP_ID }}"
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
            "NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}"
            "NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}"
            "NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL }}"
            "NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL"="${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL }}"
            "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}"
            "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
            "NEXT_PUBLIC_FLAG_CLERK_ENABLED=${{ secrets.NEXT_PUBLIC_FLAG_CLERK_ENABLED }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-20.04
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success') }}
    steps:
      - name: Check out releases repo
        uses: actions/checkout@v2
        with:
          repository: abraham-ai/releases
          ref: main
          token: ${{ secrets.GENEKOGAN_PAT }}

      - id: prep
        run: |
          IMAGE="${{ secrets.REGISTRY_URL }}/abraham-ai/mars-${{ secrets.ENV_GARDEN }}"
          TAG="${{needs.build.outputs.tag}}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      - name: Bump Env
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: 'apps/mars/eden-app-stg/values.yaml'
          updateFile: true
          propertyPath: '$.frontend_image'
          value: ${{ steps.prep.outputs.tagged_image }}
          repository: abraham-ai/releases
          branch: main
          targetBranch: main
          masterBranchName: main
          commitChange: true
          createPR: false
          message:
            'Update ${{ secrets.ENV_GARDEN }} Image Version to ${{
            steps.prep.outputs.tagged_image }}'
          token: ${{ secrets.GENEKOGAN_PAT }}

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args:
            '${{ secrets.ENV_GARDEN }} image ${{ steps.prep.outputs.tagged_image }} has
            been deployed.'