name: 'Build and Deploy - API'

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yaml'

  pull_request:
    branches: [staging]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENV_API: stg

jobs:
  build-and-push-to-ghcr:
    name: Build
    runs-on: ubuntu-20.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v2

      - id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          IMAGE="${{ env.REGISTRY }}/edenartlab/eden-api-${{ env.ENV_API }}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags:
            ${{ steps.prep.outputs.tagged_image }},${{ steps.prep.outputs.image
            }}:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-20.04
    needs: [build-and-push-to-ghcr]
    if: ${{ always() && (needs.build-and-push-to-ghcr.result == 'success') }}
    steps:
      - name: Check out releases repo
        uses: actions/checkout@v2
        with:
          repository: edenartlab/releases
          ref: main
          token: ${{ secrets.GENEKOGAN_PAT }}

      - id: prep
        run: |
          IMAGE="${{ env.REGISTRY }}/edenartlab/eden-api-${{ env.ENV_API }}"
          TAG="${{needs.build-and-push-to-ghcr.outputs.tag}}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      - name: Bump Env
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: 'apps/eden/eden-stg/values.yaml'
          updateFile: true
          propertyPath: '$.api_image'
          value: ${{ steps.prep.outputs.tagged_image }}
          repository: edenartlab/releases
          branch: main
          targetBranch: main
          masterBranchName: main
          commitChange: true
          createPR: false
          message:
            'Update ${{ env.ENV_API }} Image Version to ${{
            steps.prep.outputs.tagged_image }}'
          token: ${{ secrets.GENEKOGAN_PAT }}

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args:
            '${{ env.ENV_API }} image ${{ steps.prep.outputs.tagged_image }} has
            been deployed.'
