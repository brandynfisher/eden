name: 'Build / Deploy - Eden Watch - STAGING'

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'apps/watch/**'
      - '.github/workflows/stg-watch.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENV_GARDEN: stg

jobs:
  build-and-push-to-ghcr:
    name: Build
    runs-on: [ubuntu-22.04]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4

      - id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          IMAGE="${{ env.REGISTRY }}/edenartlab/watch-${{ env.ENV_GARDEN }}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/watch/Dockerfile
          push: true
          tags:
            ${{ steps.prep.outputs.tagged_image }},${{ steps.prep.outputs.image
            }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          build-args: |
            "NEXT_PUBLIC_APP_ENV=staging"
            "NEXT_PUBLIC_HOST=https://staging.watch.eden.art"
            "NEXT_PUBLIC_EDEN_API_URL=https://staging.api.eden.art"
            "NEXT_PUBLIC_EDEN_APP_URL=https://staging2.app.eden.art"
            "NEXT_PUBLIC_EDEN_SSE_URL=https://staging.api.eden.art"
            "NEXT_PUBLIC_EDEN_COMPUTE_SOCKET_URL=wss://staging.api.eden.art/ws/updates"
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_STG }}"
            "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_EDEN2 }}"
            "NEXT_PUBLIC_GOOGLE_GTM_ID=GTM-MR2LV55Z"
            "NEXT_PUBLIC_GOOGLE_ANALYTICS_MEASUREMENT_ID=G-W4718WCZQK"
            "NEXT_PUBLIC_AWS_CLOUDFRONT_URL=https://dtut5r9j4w7j4.cloudfront.net"
            "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
            "SENTRY_IGNORE_API_RESOLUTION_ERROR=1"
            "NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up"
            "NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in"
            "NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/"
            "NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/"
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  notify:
    needs: [build-and-push-to-ghcr]
    runs-on: [ubuntu-22.04]
    if: always()
    steps:
      - name: Discord Success Notification
        if: needs.build-and-push-to-ghcr.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          title: '🚀 Build - Eden Watch - STAGING'
          status: 'Success'
          color: 0x00ff00
          description: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

      - name: Discord Failure Notification
        if:
          needs.build-and-push-to-ghcr.result == 'failure' ||
          needs.build-and-push-to-ghcr.result == 'cancelled'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          title: '❌ Build - Eden Watch - STAGING'
          status: 'Failed'
          color: 0xff0000
          description: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Please check the workflow logs for details.
