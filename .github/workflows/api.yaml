name: 'Build and Deploy - API'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENV_API: prod

jobs:
  build-and-push-to-ghcr:
    name: Build
    runs-on: ubuntu-20.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v2

      - id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          IMAGE="${{ env.REGISTRY }}/edenartlab/eden-api-${{ env.ENV_API }}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags:
            ${{ steps.prep.outputs.tagged_image }},${{ steps.prep.outputs.image
            }}:latest
          build-args: |
            "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
            "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
            "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
            "EDEN_COMPUTE_API_URL=${{ secrets.EDEN_COMPUTE_API_URL }}"
            "EDEN_COMPUTE_API_KEY=${{ secrets.EDEN_COMPUTE_API_KEY }}"
            "EDEN2_FRONTEND_URL=https://app2.eden.art"
            "CLERK_JWT_KEY=${{ secrets.CLERK_JWT_KEY }}"