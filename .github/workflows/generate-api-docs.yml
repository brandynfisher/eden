name: Generate API Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/openapi/**'
      - 'scripts/openapi/**'
      - 'apps/api/src/routes/**'

jobs:
  generate-and-deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eden repository
        uses: actions/checkout@v4
        with:
          path: eden

      - name: Checkout mintlify-docs repository
        uses: actions/checkout@v4
        with:
          repository: edenartlab/mintlify-docs
          token: ${{ secrets.MINTLIFY_DOCS_TOKEN }}
          path: mintlify-docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: eden/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: eden
        run: yarn install --immutable

      - name: Generate OpenAPI artifacts
        working-directory: eden
        run: yarn generate:openapi-types

      - name: Commit and push to mintlify-docs
        working-directory: mintlify-docs
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Check if there are changes
          if git diff --quiet openapi/sessions-v3.yaml openapi/artifacts-v3.yaml openapi/manna-v3.yaml; then
            echo "No changes to OpenAPI spec"
            exit 0
          fi

          git add openapi/sessions-v3.yaml openapi/artifacts-v3.yaml openapi/manna-v3.yaml
          git commit -m "Update API documentation from eden repo

          Generated from: ${{ github.repository }}@${{ github.sha }}
          Triggered by: ${{ github.event.head_commit.message }}"

          git push origin main
