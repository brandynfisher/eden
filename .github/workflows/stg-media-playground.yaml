name: 'Build / Deploy - Eden Create - STAGING'

on:
  workflow_dispatch:
  push:
    branches: [ staging ]
    paths:
      - 'apps/media-playground/**'
      - '.github/workflows/stg-media-playground.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENV_GARDEN: stg

jobs:
  build-and-push-to-ghcr:
    name: Build
    runs-on: ubuntu-20.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v2

      - id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          IMAGE="${{ env.REGISTRY }}/edenartlab/media-playground-${{ env.ENV_GARDEN }}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v2

      # - name: Cache Docker layers
      #   uses: actions/cache@v3
      #   with:
      #     path: /tmp/.buildx-cache
      #     key: ${{ runner.os }}-buildx-${{ github.sha }}
      #     restore-keys: |
      #       ${{ runner.os }}-buildx-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./apps/media-playground/Dockerfile
          push: true
          tags:
            ${{ steps.prep.outputs.tagged_image }},${{ steps.prep.outputs.image
            }}:latest
          build-args: |
            "NEXT_PUBLIC_APP_ENV=staging"
            "NEXT_PUBLIC_HOST=https://staging2.app.eden.art"
            "NEXT_PUBLIC_EDEN_API_URL=https://staging.api.eden.art"
            "NEXT_PUBLIC_EDEN_SSE_URL=https://staging.api.eden.art"
            "NEXT_PUBLIC_EDEN_COMPUTE_SOCKET_URL=wss://staging.api.eden.art/ws/updates"
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_STG }}"
            "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_EDEN2 }}"
            "NEXT_PUBLIC_EDEN_FEATURED_COLLECTION_ID=670a7250ff7f3809e9b380bf"
            "NEXT_PUBLIC_DISCORD_CLIENT_ID=1001489981694554243"
            "NEXT_PUBLIC_GOOGLE_GTM_ID=GTM-MR2LV55Z"
            "NEXT_PUBLIC_GOOGLE_ANALYTICS_MEASUREMENT_ID=G-W4718WCZQK"
            "NEXT_PUBLIC_AWS_CLOUDFRONT_URL=https://dtut5r9j4w7j4.cloudfront.net"
            "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
            "SENTRY_IGNORE_API_RESOLUTION_ERROR=1"
            "NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up"
            "NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in"
            "NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/create"
            "NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/create"
  notify:
    if: always()
    needs: build-and-push-to-ghcr
    runs-on: ubuntu-latest

    steps:
      - name: Discord Webhook Trigger
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}