name: 'Build / Deploy - Eden Watch - PROD'

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'apps/watch/**'
      - '.github/workflows/watch.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENV_GARDEN: prod

jobs:
  build-and-push-to-ghcr:
    name: Build
    runs-on: ubuntu-20.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4

      - id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          IMAGE="${{ env.REGISTRY }}/edenartlab/watch-${{ env.ENV_GARDEN }}"
          echo ::set-output name=tagged_image::${IMAGE}:${TAG}
          echo ::set-output name=tag::${TAG}
          echo ::set-output name=image::${IMAGE}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/watch/Dockerfile
          push: true
          tags:
            ${{ steps.prep.outputs.tagged_image }},${{ steps.prep.outputs.image
            }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  notify:
    needs: [build-and-push-to-ghcr]
    runs-on: [ubuntu-20.04]
    if: always()
    steps:
      - name: Discord Success Notification
        if: needs.build-and-push-to-ghcr.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          title: '🚀 Build - Eden Watch - PROD'
          status: 'Success'
          color: 0x00ff00
          description: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

      - name: Discord Failure Notification
        if:
          needs.build-and-push-to-ghcr.result == 'failure' ||
          needs.build-and-push-to-ghcr.result == 'cancelled'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          title: '❌ Build - Eden Watch - PROD'
          status: 'Failed'
          color: 0xff0000
          description: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Please check the workflow logs for details.
